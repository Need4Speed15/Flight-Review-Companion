<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
<title id="title">Move a bag forward</title><desc id="desc">Fictional aircraft: weight 2000 lb; initial CG 45.0 in. A 40 lb bag moves from arm 100 in to arm 70 in, toward the datum.</desc>
<rect width="720" height="350" rx="20" fill="#102738"/><g font-family="Arial,sans-serif"><text x="28" y="38" fill="#80d2cc" font-size="15" font-weight="700">TRAINING ONLY · FICTIONAL LOADING · NOT TO SCALE</text>
<text x="30" y="83" fill="#fff" font-size="24">Weight 2,000 lb · Initial CG 45.0 in</text>
<path d="M65 246H660M90 235V257M350 235V257M600 235V257" stroke="#c5d2dc" stroke-width="3"/>
<g fill="#fff" font-size="20"><text x="57" y="286">Datum</text><text x="310" y="286">70 in</text><text x="557" y="286">100 in</text></g>
<rect x="553" y="134" width="94" height="76" rx="9" fill="#254c5b" stroke="#80d2cc" stroke-width="2"/><text x="600" y="181" text-anchor="middle" fill="#fff" font-size="25">40 lb</text>
<rect x="303" y="134" width="94" height="76" rx="9" fill="none" stroke="#80d2cc" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M530 171H417m0 0 17-12m-17 12 17 12" fill="none" stroke="#80d2cc" stroke-width="5"/>
<text x="335" y="328" fill="#c5d2dc" font-size="20">Move forward; add no weight.</text></g></svg>
